---
- name: Create roles and users
  tags: elasticsearch_users
  block:
    - name: Create logstash_writer role # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >
          curl -s -w "\n%{http_code}"
          -k
          -u elastic:{{ elasticsearch_elastic_password }}
          -X PUT https://localhost:9200/_security/role/logstash_writer
          -H "Content-Type: application/json"
          -d '{"cluster":["manage_index_templates","monitor","manage_ilm"],"indices":[{"names":["itential-logs-*","itential-failures-*"],"privileges":["write","create","create_index","manage","manage_ilm"]}]}'
      register: elasticsearch_role_result
      failed_when: elasticsearch_role_result.stdout_lines[-1] not in ["200", "201"]
      changed_when: (elasticsearch_role_result.stdout_lines[:-1] | join | from_json).role.created
      no_log: true
      run_once: true

    - name: Create logstash_writer user # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >
          curl -s -o /dev/null -w "%{http_code}"
          -k
          -u elastic:{{ elasticsearch_elastic_password }}
          -X PUT https://localhost:9200/_security/user/logstash_writer
          -H "Content-Type: application/json"
          -d '{"password":"{{ elasticsearch_logstash_writer_password }}","roles":["logstash_writer"],"full_name":"Logstash Writer"}'
      register: elasticsearch_user_result
      failed_when: elasticsearch_user_result.stdout not in ["200", "201"]
      changed_when: elasticsearch_user_result.stdout == "201"
      no_log: true
      run_once: true

    - name: Create grafana_reader role # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: >
          curl -s -w "\n%{http_code}"
          -k
          -u elastic:{{ elasticsearch_elastic_password }}
          -X PUT https://localhost:9200/_security/role/grafana_reader
          -H "Content-Type: application/json"
          -d '{"indices":[{"names":["itential-logs-*","itential-failures-*"],"privileges":["read","view_index_metadata"]}]}'
      register: elasticsearch_grafana_role_result
      failed_when: elasticsearch_grafana_role_result.stdout_lines[-1] not in ["200", "201"]
      changed_when: (elasticsearch_grafana_role_result.stdout_lines[:-1] | join | from_json).role.created
      no_log: true
      run_once: true
