---
- name: Install Elasticsearch
  tags: elasticsearch_install
  block:
    - name: Add Elasticsearch RPM GPG key
      ansible.builtin.rpm_key:
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present
      when: ansible_os_family == "RedHat"

    - name: Add Elasticsearch YUM repository
      ansible.builtin.yum_repository:
        name: elasticsearch
        description: Elasticsearch repository
        baseurl: "https://artifacts.elastic.co/packages/{{ elasticsearch_version.split('.')[0] }}.x/yum"
        gpgcheck: true
        gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Add Elasticsearch APT GPG key
      ansible.builtin.apt_key:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Elasticsearch APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://artifacts.elastic.co/packages/{{ elasticsearch_version.split('.')[0] }}.x/apt stable main"
        state: present
        filename: elasticsearch
      when: ansible_os_family == "Debian"

    - name: Install Elasticsearch package
      ansible.builtin.package:
        name: "elasticsearch{% if ansible_os_family == 'RedHat' %}-{{ elasticsearch_version }}{% endif %}"
        state: present

- name: Configure Elasticsearch
  tags: elasticsearch_configure
  block:
    - name: Ensure data and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ elasticsearch_user }}"
        group: "{{ elasticsearch_group }}"
        mode: "0750"
      loop:
        - "{{ elasticsearch_data_path }}"
        - "{{ elasticsearch_log_path }}"

    - name: Deploy elasticsearch.yml
      notify: Restart Elasticsearch
      ansible.builtin.template:
        src: elasticsearch.yml.j2
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: "{{ elasticsearch_group }}"
        mode: "0660"

    - name: Deploy JVM heap options
      notify: Restart Elasticsearch
      ansible.builtin.template:
        src: jvm.options.j2
        dest: /etc/elasticsearch/jvm.options.d/itential-heap.options
        owner: root
        group: "{{ elasticsearch_group }}"
        mode: "0660"

    - name: Create Elasticsearch keystore if it does not exist
      ansible.builtin.command:
        cmd: /usr/share/elasticsearch/bin/elasticsearch-keystore create
      become: true
      become_user: elasticsearch
      args:
        creates: /etc/elasticsearch/elasticsearch.keystore

    - name: Check if bootstrap.password exists in Elasticsearch keystore
      ansible.builtin.command:
        cmd: /usr/share/elasticsearch/bin/elasticsearch-keystore list
      register: elasticsearch_keystore_list
      changed_when: false

    - name: Add bootstrap password to Elasticsearch keystore
      ansible.builtin.shell:
        cmd: >
          set -o pipefail &&
          echo "{{ elasticsearch_elastic_password }}" |
          /usr/share/elasticsearch/bin/elasticsearch-keystore add -x bootstrap.password
      changed_when: true
      no_log: true
      when: "'bootstrap.password' not in elasticsearch_keystore_list.stdout"

- name: Copy TLS certificates
  ansible.builtin.include_tasks:
    file: copy-certs.yml
  tags:
    - elasticsearch_certificates
    - elasticsearch_certs
  when: elasticsearch_tls_copy_certs | bool

- name: Ensure Elasticsearch is running
  tags: always
  block:
    - name: Flush all handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Elasticsearch
      ansible.builtin.systemd:
        name: "{{ elasticsearch_service_name }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Assert that Elasticsearch is running
      ansible.builtin.systemd:
        name: "{{ elasticsearch_service_name }}"
      register: elasticsearch_status
      failed_when: elasticsearch_status.status.ActiveState != "active"

- name: Create users and roles
  ansible.builtin.include_tasks:
    file: create-users.yml
  tags: elasticsearch_users

- name: Apply ILM Policy
  ansible.builtin.include_tasks:
    file: apply-ilm-policy.yml
  tags: elasticsearch_apply_ilm_policy
