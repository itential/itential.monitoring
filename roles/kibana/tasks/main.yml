---
- name: Install Kibana
  tags: kibana_install
  block:
    - name: Add Elastic RPM GPG key
      ansible.builtin.rpm_key:
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present
      when: ansible_os_family == "RedHat"

    - name: Add Kibana YUM repository
      ansible.builtin.yum_repository:
        name: kibana
        description: Kibana repository
        baseurl: "https://artifacts.elastic.co/packages/{{ kibana_version.split('.')[0] }}.x/yum"
        gpgcheck: true
        gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Install Kibana package
      ansible.builtin.package:
        name: "kibana-{{ kibana_version }}"
        state: present

- name: Configure Kibana
  tags: kibana_configure
  block:
    - name: Ensure data and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kibana_user }}"
        group: "{{ kibana_group }}"
        mode: "0750"
      loop:
        - "{{ kibana_data_path }}"
        - "{{ kibana_log_path }}"

    - name: Deploy kibana.yml
      notify: Restart Kibana
      ansible.builtin.template:
        src: kibana.yml.j2
        dest: /etc/kibana/kibana.yml
        owner: root
        group: "{{ kibana_group }}"
        mode: "0660"

    - name: Create service token
      ansible.builtin.include_tasks:
        file: create-service-token.yml
      tags: kibana_service_token

- name: Copy TLS certificates
  ansible.builtin.include_tasks:
    file: copy-certs.yml
  tags:
    - kibana_certificates
    - kibana_certs
  when: kibana_tls_copy_certs | bool

- name: Ensure Kibana is running
  tags: always
  block:
    - name: Flush all handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Kibana
      ansible.builtin.systemd:
        name: "{{ kibana_service_name }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Assert that Kibana is running
      ansible.builtin.systemd:
        name: "{{ kibana_service_name }}"
      register: kibana_status
      failed_when: kibana_status.status.ActiveState != "active"
