---
# Loki endpoint — all Alloy agents push here.
# Use the private/VPC-internal IP of the Loki host.
# Use https:// when loki_tls_enabled is true on the Loki host.
alloy_loki_url: ""

# Alloy HTTP listen port (metrics, health, UI)
alloy_http_listen_port: 12345

# Service
alloy_service_name: alloy

# Additional file-based log paths to tail.
# Each entry requires 'path' and 'job'.
# Set per host group via inventory group_vars — do not set globally here.
# Example:
#   alloy_log_paths:
#     - path: /var/log/nginx/*.log
#       job: nginx
alloy_log_paths: []

# Extra OS groups to add the alloy user to for log file read access.
# Set per host group via inventory group_vars.
# Examples:
#   mongodb hosts:  alloy_extra_groups: [mongod]
#   iag5 hosts:     alloy_extra_groups: [itential]
alloy_extra_groups: []

# TLS — secures the connection from Alloy to Loki.
# alloy_loki_url must use https:// when TLS is enabled.
# Certs must be pre-placed on the host; this role does not deploy them.
alloy_tls_enabled: false
alloy_tls_ca_file: /etc/alloy/certs/ca.crt
