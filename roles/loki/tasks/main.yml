---
- name: Install Loki
  tags: loki_install
  block:
    - name: Install unzip
      ansible.builtin.dnf:
        name: unzip
        state: present

    - name: Create loki group
      ansible.builtin.group:
        name: "{{ loki_group }}"
        system: true

    - name: Create loki user
      ansible.builtin.user:
        name: "{{ loki_user }}"
        group: "{{ loki_group }}"
        system: true
        shell: /sbin/nologin
        home: "{{ loki_data_dir }}"
        create_home: false

    - name: Ensure data and config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ loki_user }}"
        group: "{{ loki_group }}"
        mode: "0755"
      loop:
        - "{{ loki_config_dir }}"
        - "{{ loki_data_dir }}"
        - "{{ loki_data_dir }}/chunks"
        - "{{ loki_data_dir }}/rules"

    - name: Check installed Loki version
      ansible.builtin.command:
        cmd: "{{ loki_install_dir }}/loki --version"
      register: loki_installed_version
      changed_when: false
      failed_when: false

    - name: Download and install Loki binary
      when: loki_version not in (loki_installed_version.stdout | default(''))
      block:
        - name: Create temporary install directory
          ansible.builtin.tempfile:
            state: directory
          register: loki_temp_install_dir

        - name: Download Loki binary
          ansible.builtin.get_url:
            url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
            dest: "{{ loki_temp_install_dir.path }}/loki-linux-amd64.zip"
            mode: "0644"

        - name: Extract Loki binary
          ansible.builtin.unarchive:
            src: "{{ loki_temp_install_dir.path }}/loki-linux-amd64.zip"
            dest: "{{ loki_temp_install_dir.path }}"
            remote_src: true

        - name: Install Loki binary
          ansible.builtin.copy:
            src: "{{ loki_temp_install_dir.path }}/loki-linux-amd64"
            dest: "{{ loki_install_dir }}/loki"
            owner: root
            group: root
            mode: "0755"
            remote_src: true
          notify: Restart Loki

      always:
        - name: Remove temporary install directory
          ansible.builtin.file:
            path: "{{ loki_temp_install_dir.path }}"
            state: absent
          when: loki_temp_install_dir is defined

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Open Loki HTTP port in firewall
      ansible.posix.firewalld:
        port: "{{ loki_http_listen_port }}/tcp"
        permanent: true
        state: enabled
        zone: public
        immediate: true
      when:
        - ansible_facts.services["firewalld.service"] is defined
        - ansible_facts.services["firewalld.service"].state == "running"
        - ansible_facts.services["firewalld.service"].status == "enabled"

- name: Configure Loki
  tags: loki_configure
  block:
    - name: Deploy loki-config.yml
      ansible.builtin.template:
        src: loki-config.yml.j2
        dest: "{{ loki_config_dir }}/loki-config.yml"
        owner: "{{ loki_user }}"
        group: "{{ loki_group }}"
        mode: "0640"
      notify: Restart Loki

    - name: Deploy Loki systemd service
      ansible.builtin.template:
        src: loki.service.j2
        dest: /etc/systemd/system/loki.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Loki

- name: Ensure Loki is running
  tags: always
  block:
    - name: Flush all handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Loki
      ansible.builtin.systemd:
        name: "{{ loki_service_name }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Assert that Loki is running
      ansible.builtin.systemd:
        name: "{{ loki_service_name }}"
      register: loki_status
      failed_when: loki_status.status.ActiveState != "active"

    - name: Wait for Loki to be ready
      ansible.builtin.uri:
        url: "{{ 'https' if loki_tls_enabled | bool else 'http' }}://localhost:{{ loki_http_listen_port }}/ready"
        validate_certs: false
        status_code: 200
      register: loki_ready
      until: loki_ready.status == 200
      retries: 12
      delay: 5
