---
loki_version: "3.7.1"

# Network
loki_http_listen_port: 3100
loki_grpc_listen_port: 9096

# Filesystem paths
loki_data_dir: /var/lib/loki
loki_config_dir: /etc/loki
loki_install_dir: /usr/local/bin

# System user/group
loki_user: loki
loki_group: loki

# Service
loki_service_name: loki

# Retention (168h = 7d, 744h = 31d)
loki_reject_old_samples_max_age: 168h

# Query limits
loki_max_entries_limit: 5000
loki_ingestion_rate_mb: 16
loki_ingestion_burst_size_mb: 32

# TLS — server-side TLS for the HTTP listener.
# Certs must be pre-placed on the host; this role does not deploy them.
loki_tls_enabled: false
loki_tls_cert_file: /etc/loki/certs/loki.crt
loki_tls_key_file: /etc/loki/certs/loki.key
