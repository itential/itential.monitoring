---
logstash_version: "8.13.0"

# JVM heap (set both to the same value, no more than 50% of RAM)
logstash_heap_size: "1g"

# Paths
logstash_data_path: /var/lib/logstash
logstash_log_path: /var/log/logstash

# System user/group created by the package
logstash_user: logstash
logstash_group: logstash

# Service
logstash_service_name: logstash

# Beats input
logstash_beats_port: 5044

# TLS — secures both the Beats input and the Elasticsearch output
logstash_tls_enabled: true
logstash_tls_copy_certs: true
logstash_pki_src_dir: ""
logstash_pki_base_dir: /etc/pki/logstash
logstash_pki_private_subdir: private
logstash_pki_private_dir: "{{ logstash_pki_base_dir }}/{{ logstash_pki_private_subdir }}"
logstash_tls_cert_file: "{{ inventory_hostname }}.crt"
logstash_tls_cert_src: "{{ logstash_pki_src_dir }}/{{ logstash_tls_cert_file }}"
logstash_tls_cert_dest: "{{ logstash_pki_base_dir }}/{{ logstash_tls_cert_file }}"
logstash_tls_key_file: "{{ inventory_hostname }}.key"
logstash_tls_key_src: "{{ logstash_pki_src_dir }}/{{ logstash_tls_key_file }}"
logstash_tls_key_dest: "{{ logstash_pki_private_dir }}/{{ logstash_tls_key_file }}"
logstash_tls_ca_file: ca.crt
logstash_tls_ca_src: "{{ logstash_pki_src_dir }}/{{ logstash_tls_ca_file }}"
logstash_tls_ca_dest: "{{ logstash_pki_base_dir }}/{{ logstash_tls_ca_file }}"

# Elasticsearch output
logstash_elasticsearch_hosts:
  - "https://localhost:9200"

# Keystore password — must be overridden (use Ansible Vault); empty passwords are not allowed in Logstash 8+
logstash_keystore_password: ""

# Elasticsearch password for the logstash_writer user — must be overridden (use Ansible Vault)
logstash_elastic_password: ""

# Pipeline workers (defaults to number of CPUs)
logstash_pipeline_workers: "{{ ansible_processor_vcpus | default(2) }}"
logstash_pipeline_batch_size: 125
logstash_pipeline_batch_delay: 50
