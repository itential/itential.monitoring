---
filebeat_version: "8.13.0"

# Paths
filebeat_data_path: /var/lib/filebeat
filebeat_inputs_path: /etc/filebeat/inputs.d
filebeat_log_path: /var/log/filebeat

# System user/group created by the package
filebeat_user: root
filebeat_group: root

# Environment
filebeat_environment: unset

# Service
filebeat_service_name: filebeat

# Log inputs — list of paths to harvest
filebeat_inputs:
  - type: filestream
    id: syslog
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/messages
    fields:
      log_type: syslog

# TLS — secures the connection to Logstash or Elasticsearch
filebeat_tls_enabled: true
filebeat_tls_ca_cert: /etc/filebeat/certs/ca.crt
filebeat_tls_cert: /etc/filebeat/certs/filebeat.crt
filebeat_tls_key: /etc/filebeat/certs/filebeat.key

# Output — mutually exclusive; set only one
# Send to Logstash (default)
filebeat_output_logstash_enabled: true
filebeat_output_logstash_hosts:
  - "localhost:5044"

# Send directly to Elasticsearch
filebeat_output_elasticsearch_enabled: false
filebeat_output_elasticsearch_hosts:
  - "https://localhost:9200"
filebeat_output_elasticsearch_index: "filebeat-%{+YYYY.MM.dd}"

# Kibana — used for dashboard setup
filebeat_setup_kibana_host: "https://localhost:5601"
filebeat_setup_dashboards_enabled: false
